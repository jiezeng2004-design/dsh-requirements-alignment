<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Result Page</title>
</head>
<body>
  <main>
    <h1>Results</h1>
    <section class="filters" aria-label="Filter results">
      <button data-filter="all" class="filter active">All</button>
      <button data-filter="design" class="filter">Design</button>
      <button data-filter="code" class="filter">Code</button>
      <button data-filter="writing" class="filter">Writing</button>
    </section>
    <p id="count" aria-live="polite"></p>
    <ul id="results" class="results"></ul>
    <p id="pager" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
