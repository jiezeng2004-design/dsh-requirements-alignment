<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskboard — Personal Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">Taskboard</h1>
      <p class="app-subtitle">Your personal task manager — everything stays on this device.</p>
    </header>

    <section class="composer" aria-label="Add a task">
      <form id="add-form" class="add-form" autocomplete="off">
        <input
          id="new-task-title"
          class="add-input"
          type="text"
          placeholder="What needs to be done?"
          aria-label="Task title"
          maxlength="200"
          required
        />
        <input
          id="new-task-due"
          class="add-due"
          type="date"
          aria-label="Due date"
        />
        <select id="new-task-priority" class="add-priority" aria-label="Priority">
          <option value="none">Priority…</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>

    <section class="toolbar" aria-label="Filter and search">
      <div class="filter-group" role="group" aria-label="Filter tasks">
        <button class="filter-btn is-active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="active" type="button">Active</button>
        <button class="filter-btn" data-filter="completed" type="button">Completed</button>
      </div>
      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="Search tasks…"
        aria-label="Search tasks"
      />
    </section>

    <section class="list-section" aria-label="Task list">
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state" hidden></p>
    </section>

    <footer class="app-footer">
      <span id="task-count" class="task-count"></span>
      <button id="clear-completed" class="btn btn-ghost" type="button" hidden>Clear completed</button>
    </footer>
  </main>

  <template id="task-template">
    <li class="task-item" data-id="">
      <label class="task-check">
        <input type="checkbox" class="task-toggle" aria-label="Toggle completion" />
        <span class="checkmark" aria-hidden="true"></span>
      </label>
      <div class="task-body">
        <span class="task-title"></span>
        <div class="task-meta">
          <span class="task-due"></span>
          <span class="task-priority"></span>
        </div>
      </div>
      <div class="task-actions">
        <button class="btn-icon task-edit" type="button" aria-label="Edit task" title="Edit">✎</button>
        <button class="btn-icon task-delete" type="button" aria-label="Delete task" title="Delete">✕</button>
      </div>
    </li>
  </template>

  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" method="dialog" class="edit-form">
      <h2 class="edit-heading">Edit task</h2>
      <input id="edit-title" type="text" maxlength="200" required aria-label="Task title" />
      <div class="edit-row">
        <input id="edit-due" type="date" aria-label="Due date" />
        <select id="edit-priority" aria-label="Priority">
          <option value="none">No priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="edit-actions">
        <button type="button" class="btn btn-ghost" id="edit-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
